name: Deploy to Production

# Single-container deploy for 1GB EC2. Requires CI to have passed on master before running.
# Do not use scripts/deploy.sh (blue-green) unless the instance is ≥2GB — see docs/ZERO_DOWNTIME.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy:
    name: Deploy (single-container)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /app && git pull origin master
            chmod +x /app/scripts/deploy-single.sh
            /app/scripts/deploy-single.sh
