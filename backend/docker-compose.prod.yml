services:
  db:
    image: postgres:15-alpine
    container_name: affinity_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app_blue:
    image: ghcr.io/${GHCR_OWNER}/affinity-backend:${IMAGE_TAG:-latest}
    container_name: affinity_app_blue
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=15
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy

  app_green:
    image: ghcr.io/${GHCR_OWNER}/affinity-backend:${IMAGE_TAG:-latest}
    container_name: affinity_app_green
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=15
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
