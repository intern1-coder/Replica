name: affinity-dummy

services:
  db:
    image: postgres:15-alpine
    container_name: affinity_dummy_db
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dummy-password
      POSTGRES_DB: affinity_dummy
    volumes:
      - pgdata_dummy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app_blue:
    build: .
    image: affinity-backend:dummy
    container_name: affinity_dummy_app_blue
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: development
      ALLOW_PRODUCTION: "false"
      DATABASE_URL: postgresql://postgres:dummy-password@db:5432/affinity_dummy?schema=public&connection_limit=15
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      db:
        condition: service_healthy

  app_green:
    build: .
    image: affinity-backend:dummy
    container_name: affinity_dummy_app_green
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: development
      ALLOW_PRODUCTION: "false"
      DATABASE_URL: postgresql://postgres:dummy-password@db:5432/affinity_dummy?schema=public&connection_limit=15
    ports:
      - "127.0.0.1:3102:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dummy:
