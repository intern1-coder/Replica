services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: affinity-backend
    container_name: affinity_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_URL=${APP_URL}
      - SMTP_FROM=${SMTP_FROM}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # Native AWS S3 needs no endpoint; STORAGE_ENDPOINT only for S3-compatible providers
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_REGION=${STORAGE_REGION}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      # Bootstrap script (scripts/bootstrap-users.ts) — optional, used for initial admin setup
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Super Admin}
      - CLIENT_ADMIN_EMAIL=${CLIENT_ADMIN_EMAIL:-}
      - CLIENT_ADMIN_PASSWORD=${CLIENT_ADMIN_PASSWORD:-}
      - CLIENT_ADMIN_NAME=${CLIENT_ADMIN_NAME:-Client Admin}
      # Puppeteer path is handled inside Dockerfile, but can be overridden if necessary
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: affinity_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
